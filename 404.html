<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Not Found · Yi Chamber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&family=IBM+Plex+Sans:wght@300;400&family=Noto+Serif+TC&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1A1A1A;
      --rice: #F4EFE6;
      --brass: #9C7B3C;
      --patina: #6B5D45;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--ink);
      color: var(--rice);
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }
    .seal {
      font-family: 'Noto Serif TC', serif;
      font-size: 3rem;
      color: var(--brass);
      letter-spacing: 0.3em;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-weight: 400;
      font-size: 1.5rem;
      color: var(--brass);
      margin-bottom: 2rem;
    }
    a {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--rice);
      text-decoration: none;
      padding: 1rem 2rem;
      border: 1px solid var(--brass);
      transition: all 0.4s ease;
    }
    a:hover {
      background: var(--brass);
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="seal">易 室</div>
  <h1>The way that can be named is not the eternal way.</h1>
  <a href="/">Return to the threshold</a>
</body>
</html>
